name: habits
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.2.3
  flutter_timezone: ^5.1.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  intl: ^0.20.2
  json_annotation: 4.9.0
  phosphor_icons: ^3.0.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: 3.2.3
  # 6.14.x requires analyzer >=10, which conflicts with Flutter 3.38's
  # flutter_test/test_api pin and Riverpod 3.3.x's test dependency.
  json_serializable: 6.11.2
  firebase_auth_mocks: ^0.15.2
  fake_cloud_firestore: ^4.2.0
  integration_test:
    sdk: flutter
  mock_exceptions: ^0.8.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/backgrounds/
    - assets/icons/
    - assets/icons/habits/
    - assets/icons/progress/
    - assets/images/
    - assets/images/cards/
    - assets/logo/
